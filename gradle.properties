org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
# 上面 -Duser.language=en 是必须的：javac 的中文提示是 UTF-8，而 Windows 控制台按 GBK 解码，
# 会显示成「娉? 鏌愪簺杈撳叆鏂囦欢…」这类乱码。让 javac 只输出英文（纯 ASCII）就彻底没这个问题。
org.gradle.parallel=true
org.gradle.caching=true

# 使用本机 JDK 25 运行 Gradle（如 JAVA_HOME 已指向 JDK 25，可删除此行）
org.gradle.java.home=D:/Program Files/zulu25
